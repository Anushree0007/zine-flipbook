<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zine</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161311;
      background-image: radial-gradient(circle at center, #241d1b 0%, #161311 75%, #0e0c0b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .flipbook-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 12px;
    }

    .flipbook-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 8px 20px rgba(0, 0, 0, 0.5);
      border-radius: 3px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flipbook {
      position: relative;
      display: block;
    }

    .page {
      background-color: #2b2320;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    /* Soft spine shadow overlays */
    .page:nth-child(even)::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 28px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.22), transparent);
      pointer-events: none;
    }

    .page:nth-child(odd)::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 28px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.22), transparent);
      pointer-events: none;
    }

    /* Minimal Floating Navigation Arrows (Icon-Only, No Text) */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(28, 23, 21, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #dfd3c3;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .flipbook-stage:hover .nav-arrow {
      opacity: 0.7;
    }

    .nav-arrow:hover:not(:disabled) {
      opacity: 1 !important;
      transform: translateY(-50%) scale(1.1);
      background-color: rgba(45, 38, 35, 0.95);
      color: #fff;
    }

    .nav-arrow:active:not(:disabled) {
      transform: translateY(-50%) scale(0.95);
    }

    .nav-arrow:disabled {
      opacity: 0 !important;
      pointer-events: none;
    }

    .nav-prev {
      left: 18px;
    }

    .nav-next {
      right: 18px;
    }

    @media (max-width: 600px) {
      .nav-arrow {
        width: 36px;
        height: 36px;
        opacity: 0.6;
      }
      .nav-prev { left: 8px; }
      .nav-next { right: 8px; }
    }
  </style>

  <!-- Local PageFlip with CDN fallback -->
  <script src="page-flip.browser.js"></script>
  <script>
    if (typeof St === 'undefined' || !St.PageFlip) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"><\/script>');
    }
  </script>
</head>
<body>
  <div class="flipbook-stage">
    <div class="flipbook-wrapper">
      <div id="flipbook" class="flipbook">
        <div class="page" data-density="soft"><img src="pages/page-01.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-02.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-03.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-04.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-05.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-06.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-07.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-08.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-09.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-10.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-11.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-12.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-13.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-14.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-15.jpg" alt=""></div>
        <div class="page" data-density="soft"><img src="pages/page-16.jpg" alt=""></div>
      </div>
    </div>

    <!-- Icon-only Side Navigation Arrows (No Text) -->
    <button id="btn-prev" class="nav-arrow nav-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button id="btn-next" class="nav-arrow nav-next" aria-label="Next">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      const flipbookEl = document.getElementById('flipbook');
      const wrapperEl = document.querySelector('.flipbook-wrapper');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      const basePageWidth = 1048;
      const basePageHeight = 1488;
      const aspectRatioSpread = (basePageWidth * 2) / basePageHeight; // ~1.408
      const aspectRatioSingle = basePageWidth / basePageHeight; // ~0.704
      const totalPages = 16;
      let pageFlip = null;
      let audioCtx = null;

      /* Realistic paper turn sound via Web Audio API */
      function playPaperSound() {
        try {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (!audioCtx) return;

          const duration = 0.2;
          const bufferSize = audioCtx.sampleRate * duration;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            const env = Math.pow(1 - i / bufferSize, 2.5);
            data[i] = (Math.random() * 2 - 1) * env;
          }

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(800, audioCtx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + duration);
          filter.Q.setValueAtTime(1.5, audioCtx.currentTime);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          noise.start();
        } catch (e) {}
      }

      function updateDimensions() {
        const isPortrait = window.innerWidth <= 640;
        const paddingX = isPortrait ? 16 : 60;
        const paddingY = 40;

        const availW = window.innerWidth - paddingX;
        const availH = window.innerHeight - paddingY;
        const ratio = isPortrait ? aspectRatioSingle : aspectRatioSpread;

        let w = availW;
        let h = w / ratio;

        if (h > availH) {
          h = availH;
          w = h * ratio;
        }

        wrapperEl.style.width = Math.round(w) + 'px';
        wrapperEl.style.height = Math.round(h) + 'px';
      }

      function init() {
        updateDimensions();

        // Check deep link hash (e.g. #p=6)
        let startPage = 0;
        const match = window.location.hash.match(/(?:p|page)=(\d+)/i);
        if (match) {
          const num = parseInt(match[1], 10);
          if (num >= 1 && num <= totalPages) {
            startPage = num - 1;
          }
        }

        pageFlip = new St.PageFlip(flipbookEl, {
          width: 524,
          height: 744,
          size: 'stretch',
          minWidth: 260,
          maxWidth: 1200,
          minHeight: 370,
          maxHeight: 1700,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false,
          usePortrait: true,
          startPage: startPage,
          flippingTime: 700,
          useMouseEvents: true,
          swipeDistance: 25,
          clickEventForward: true
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        pageFlip.on('flip', (e) => {
          playPaperSound();
          updateButtons();
          const pageNum = e.data + 1;
          if (window.location.hash !== '#p=' + pageNum) {
            history.replaceState(null, '', '#p=' + pageNum);
          }
        });

        pageFlip.on('changeOrientation', updateButtons);

        btnPrev.addEventListener('click', (e) => {
          e.stopPropagation();
          pageFlip.flipPrev();
        });

        btnNext.addEventListener('click', (e) => {
          e.stopPropagation();
          pageFlip.flipNext();
        });

        window.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            pageFlip.flipPrev();
          } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            e.preventDefault();
            pageFlip.flipNext();
          } else if (e.key === 'Home') {
            e.preventDefault();
            pageFlip.flip(0);
          } else if (e.key === 'End') {
            e.preventDefault();
            pageFlip.flip(totalPages - 1);
          }
        });

        let resizeTimer = null;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            updateDimensions();
            if (pageFlip) pageFlip.update();
          }, 80);
        });

        window.addEventListener('pointerdown', () => {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
          }
        }, { once: true });

        updateButtons();
      }

      function updateButtons() {
        if (!pageFlip) return;
        const current = pageFlip.getCurrentPageIndex();
        btnPrev.disabled = (current === 0);
        btnNext.disabled = (current >= totalPages - 1);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
